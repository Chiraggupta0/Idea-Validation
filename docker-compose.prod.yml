# The EC2 instance's actual running config. Copied to ~/sivp/docker-compose.yml
# by the deploy workflow on every push — the server never hand-edits this file,
# so there's no drift between what's in git and what's actually running.
#
# IMAGE_TAG is set to the deploying commit's SHA by CI, so each deploy
# references an exact, unambiguous image — never the mutable `:latest` tag —
# which guarantees docker compose always recreates the container.
#
# Every service caps its logs. Docker's default json-file driver grows
# without limit, which on a small EBS volume eventually fills the disk and
# takes the whole stack down.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: chiraggupta01/sivp-backend:${IMAGE_TAG:-latest}
    restart: always
    logging: *default-logging
    ports:
      - "8080:8080"
    environment:
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/validate-idea
      # nginx proxies /api on the same origin, so CORS only matters for direct
      # hits to :8080 — kept for local dev and debugging.
      CORS_ORIGINS: https://sivp.space,https://www.sivp.space,http://localhost:5173
      N8N_CONNECT_TIMEOUT_MS: 10000
      N8N_READ_TIMEOUT_MS: 180000

  web:
    image: chiraggupta01/sivp-web:${IMAGE_TAG:-latest}
    restart: always
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificates issued on the host by certbot, plus the webroot it uses
      # to answer ACME challenges on renewal.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:latest
    restart: always
    logging: *default-logging
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: 34.232.142.24
      N8N_PROTOCOL: http
      N8N_PORT: 5678
      WEBHOOK_URL: http://34.232.142.24:5678/
      GENERIC_TIMEZONE: Asia/Kolkata
      N8N_SECURE_COOKIE: "false"
      # One validation writes 11 executions (10 agents + NEXUS), each holding
      # the full JSON payload it passed downstream. Without pruning, the SQLite
      # database grows without bound and is the biggest long-term disk risk here.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"          # keep 7 days of history
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "2000" # …and at most this many
    volumes:
      - /home/ubuntu/n8n-data:/home/node/.n8n
