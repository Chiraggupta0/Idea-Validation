spring.application.name=sivp-backend
server.port=8080

# The n8n NEXUS webhook (must have the workflow toggled Active for the /webhook/ URL).
n8n.webhook.url=http://localhost:5678/webhook/validate-idea

# Frontend origins allowed to call this API (Vite dev ports).
sivp.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# The pipeline is slow (10 LLM calls) — allow a long read timeout.
n8n.connect-timeout-ms=10000
n8n.read-timeout-ms=180000
