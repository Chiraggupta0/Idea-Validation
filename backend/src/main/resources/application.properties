spring.application.name=sivp-backend

# Render injects PORT; falls back to 8080 locally.
server.port=${PORT:8080}

# The n8n NEXUS webhook. In production set N8N_WEBHOOK_URL to a PUBLIC n8n URL
# (hosted/tunnelled) — a localhost URL is not reachable from Render.
n8n.webhook.url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/validate-idea}

# Comma-separated frontend origins allowed to call this API. In production set
# CORS_ORIGINS to your Vercel URL, e.g. https://sivp.vercel.app
sivp.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

# The pipeline is slow (10 LLM calls) — allow a long read timeout.
n8n.connect-timeout-ms=${N8N_CONNECT_TIMEOUT_MS:10000}
n8n.read-timeout-ms=${N8N_READ_TIMEOUT_MS:180000}
