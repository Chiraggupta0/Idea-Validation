server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # React Router uses client-side routing — unknown paths fall back to
    # index.html instead of a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets; index.html itself stays uncached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
