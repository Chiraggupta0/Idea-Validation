# HTTP: serve the ACME challenge for certificate renewal, redirect the rest.
server {
    listen 80;
    server_name sivp.space www.sivp.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sivp.space www.sivp.space;

    ssl_certificate     /etc/letsencrypt/live/sivp.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sivp.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API is proxied on the same origin, so the browser never makes a
    # cross-origin (or plain-HTTP) request — no CORS, no mixed content.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The 10-agent pipeline legitimately takes 60-90s; don't cut it off.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # React Router uses client-side routing — unknown paths fall back to
    # index.html instead of a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets; index.html itself stays uncached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
